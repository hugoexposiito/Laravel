name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 200.234.231.107
          port: 2222
          username: hugo
          key: ${{ secrets.PRIVATE_KEY }}
          script: "set -eu; cd /var/www/html/Laravel; git pull --ff-only origin master; npm ci; npm run build;"